# nginx reverse-proxy for the HopCharge HR Dashboard.
# deploy/setup_server.sh replaces YOUR_DOMAIN and installs this to
# /etc/nginx/sites-available/hopcharge.
#
# HTTPS: after DNS points at the server, run
#   sudo certbot --nginx -d YOUR_DOMAIN --redirect
# certbot rewrites this file to add the 443/SSL server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Resume PDFs are uploaded in batches — allow large request bodies.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bulk CV parsing / form sync can run for minutes — don't cut it off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

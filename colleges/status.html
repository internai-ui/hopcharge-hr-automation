<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Application Status — Hopcharge</title>
<style>
  /* ── Hopcharge tracker — matches the recruitment-email / portal aesthetic ──
     Navy #1F2D59 brand, pink #E8537F accent, calm slate body. The signature
     element is the vertical stage timeline with the candidate's reference
     code quietly anchored in the header. */
  :root{
    --navy:#1F2D59; --navy-soft:#9FB0D8; --ink:#1f2a44; --slate:#5b6472;
    --muted:#8a93a6; --line:#e6e9f0; --bg:#eef1f6; --card:#ffffff;
    --pink:#E8537F; --blue:#2F5BEA; --green:#16a34a; --grey:#9aa3b6;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:560px; margin:34px auto; padding:0 14px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:0 18px 50px rgba(31,45,89,.08);
  }
  .head{
    background:var(--navy); padding:26px 32px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
  }
  .head .brand{color:#fff; font-size:24px; font-weight:800; letter-spacing:-.5px}
  .head .eyebrow{color:var(--navy-soft); font-size:11px; letter-spacing:3px;
    text-transform:uppercase; margin-top:6px}
  .ref{
    text-align:right; color:var(--navy-soft); font-size:10.5px;
    letter-spacing:2px; text-transform:uppercase;
  }
  .ref strong{display:block; color:#fff; font-size:14px; letter-spacing:1px;
    font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums}
  .body{padding:30px 32px}
  .greet{font-size:13px; color:var(--muted); margin:0 0 6px}
  .headline{font-size:24px; font-weight:800; color:var(--navy); margin:0 0 10px;
    line-height:1.2}
  .sub{font-size:14.5px; line-height:1.65; color:var(--slate); margin:0 0 6px}
  .role{
    display:inline-block; margin:14px 8px 4px 0; font-size:12px; color:var(--slate);
    background:#f3f4f8; border:1px solid var(--line); border-radius:20px; padding:5px 14px;
  }
  /* Stage timeline */
  .stepper{list-style:none; margin:26px 0 4px; padding:0}
  .step{position:relative; padding:0 0 30px 46px; min-height:34px}
  .step:last-child{padding-bottom:0}
  .step::before{content:''; position:absolute; left:16px; top:30px; bottom:2px;
    width:2px; background:#e1e5ee}
  .step:last-child::before{display:none}
  .step.done::before{background:var(--green)}
  .dot{position:absolute; left:0; top:0; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700}
  .step.upcoming .dot{background:#fff; border:2px solid #cdd3df; color:#aab1c2}
  .step.done .dot{background:var(--green); color:#fff}
  .step.closed .dot{background:var(--grey); color:#fff}
  .step.current .dot{background:var(--blue); color:#fff; box-shadow:0 0 0 5px rgba(47,91,234,.16)}
  .s-label{font-size:15px; font-weight:700; color:var(--ink); line-height:34px}
  .step.upcoming .s-label{color:var(--grey); font-weight:600}
  .step.current .s-label{color:var(--blue)}
  /* Next-step callout */
  .next{
    margin-top:22px; padding:14px 16px; border-radius:10px;
    background:#f6f8ff; border:1px solid #e2e8ff;
    font-size:13.5px; color:var(--navy);
  }
  .next b{font-weight:700}
  .foot{padding:18px 32px 26px; border-top:1px solid var(--bg); font-size:12.5px; color:var(--muted)}
  /* States: loading / error */
  .state{padding:48px 32px; text-align:center}
  .state .headline{margin-bottom:10px}
  .spinner{width:30px; height:30px; margin:0 auto 18px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--blue); animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.spinner{animation:none}}
  @media(max-width:480px){
    .head,.body,.foot,.state{padding-left:22px; padding-right:22px}
    .headline{font-size:21px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div>
          <div class="brand">Hopcharge</div>
          <div class="eyebrow">Application Status</div>
        </div>
        <div class="ref" id="ref-box" style="display:none">
          Reference
          <strong id="ref-code">—</strong>
        </div>
      </div>
      <div id="content">
        <div class="state">
          <div class="spinner" id="spinner"></div>
          <p class="sub" id="loading-text">Checking your application status…</p>
        </div>
      </div>
      <div class="foot">Questions about your application? Just reply to the email we sent you.</div>
    </div>
  </div>

<script>
(function () {
  // ── CONFIG ───────────────────────────────────────────────────────────────
  // Point this at your backend's public tunnel URL (Cloudflare Tunnel).
  // Example: "https://status.hopcharge.com"  or the trycloudflare URL.
  // No trailing slash.
  var API_BASE = "https://REPLACE-WITH-YOUR-TUNNEL-URL";

  // ── Read the token from the URL ──────────────────────────────────────────
  // Supports both ?token=… and a trailing /status/<token> path form.
  function getToken() {
    var p = new URLSearchParams(window.location.search);
    var t = p.get("token");
    if (t) return t.trim();
    var m = window.location.pathname.match(/\/status\/([^\/?#]+)/);
    return m ? decodeURIComponent(m[1]) : "";
  }

  var GLYPH = { done: "\u2713", closed: "\u2013", current: "\u25CF" };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderSteps(steps) {
    return '<ol class="stepper">' + steps.map(function (s, i) {
      var g = GLYPH[s.state] || String(i + 1);
      return '<li class="step ' + esc(s.state) + '">' +
               '<span class="dot">' + g + '</span>' +
               '<div class="s-label">' + esc(s.label) + '</div>' +
             '</li>';
    }).join("") + '</ol>';
  }

  function renderStatus(d) {
    if (d.ref) {
      document.getElementById("ref-code").textContent = d.ref;
      document.getElementById("ref-box").style.display = "block";
    }
    var role = d.role
      ? '<div class="role">Applied for: ' + esc(d.role.replace(/\b\w/g, function (c) { return c.toUpperCase(); })) + '</div>'
      : "";
    var next = d.next_step
      ? '<div class="next"><b>Next step:</b> ' + esc(d.next_step) + '</div>'
      : "";
    document.getElementById("content").innerHTML =
      '<div class="body">' +
        '<p class="greet">Hi ' + esc(d.first_name) + ',</p>' +
        '<h1 class="headline">' + esc(d.headline) + '</h1>' +
        '<p class="sub">' + esc(d.sub) + '</p>' +
        role +
        renderSteps(d.steps || []) +
        next +
      '</div>';
  }

  function renderNotice(title, msg) {
    document.getElementById("content").innerHTML =
      '<div class="state">' +
        '<h1 class="headline">' + esc(title) + '</h1>' +
        '<p class="sub">' + esc(msg) + '</p>' +
      '</div>';
  }

  // ── Fetch + render ─────────────────────────────────────────────────────────
  var token = getToken();
  if (!token || token.length < 20) {
    renderNotice("Open your personal link",
      "To protect your privacy, your application status can only be viewed " +
      "through the \u201cCheck Application Status\u201d button in the email we sent you.");
    return;
  }

  fetch(API_BASE + "/api/status/" + encodeURIComponent(token), {
    method: "GET",
    headers: { "Accept": "application/json" },
    credentials: "omit",
    cache: "no-store"
  })
  .then(function (res) {
    if (res.status === 429) {
      renderNotice("One moment", "Too many checks just now. Please wait a minute and refresh.");
      return null;
    }
    return res.json().catch(function () { return null; });
  })
  .then(function (data) {
    if (data === null) return;
    if (!data.found) {
      renderNotice("Application not found",
        "We couldn't find an application for this link. Please use the " +
        "\u201cCheck Application Status\u201d button in your email.");
      return;
    }
    renderStatus(data);
  })
  .catch(function () {
    renderNotice("We couldn't load your status",
      "Something went wrong reaching our system. Please try again in a few minutes, " +
      "or reply to the email we sent you.");
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hopcharge — Dashboard Users</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --navy:#1F2D59; --blue:#2F5BEA; --pink:#E8537F;
  --bg:#f4f6fa; --text:#1f2a44; --text-mid:#5b6472; --text-dim:#8a93a6;
  --border:rgba(31,45,89,0.14); --red:#e11d48; --green:#16a34a;
}
body { font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:32px 20px; }
.wrap { max-width:860px; margin:0 auto; }
.top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
h1 { font-size:20px; font-weight:600; }
h1 span { color:var(--text-dim); font-weight:400; font-size:13px; display:block; margin-top:2px; }
.top a { font-size:13px; color:var(--blue); text-decoration:none; font-weight:500; }
.top a:hover { text-decoration:underline; }
.badges { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
.badge { font-size:11.5px; padding:5px 12px; border-radius:20px; border:1px solid var(--border); background:#fff; color:var(--text-mid); }
.badge b { color:var(--navy); font-weight:600; }
.card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px 24px; margin-bottom:18px; box-shadow:0 6px 24px rgba(31,45,89,0.06); }
.card h2 { font-size:14px; font-weight:600; margin-bottom:14px; }
.addrow { display:flex; gap:10px; flex-wrap:wrap; }
.addrow input, .addrow select {
  padding:10px 13px; font:inherit; font-size:13.5px; color:var(--text);
  border:1px solid var(--border); border-radius:10px; background:#fbfcfe; outline:none;
}
.addrow input { flex:1; min-width:220px; }
.addrow input:focus, .addrow select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,91,234,0.14); }
button {
  padding:10px 18px; font:inherit; font-size:13px; font-weight:600; color:#fff;
  background:linear-gradient(120deg,var(--navy),#2a3d78); border:0; border-radius:10px; cursor:pointer;
  transition:box-shadow .15s, opacity .15s;
}
button:hover { box-shadow:0 6px 16px rgba(31,45,89,0.25); }
button:disabled { opacity:.55; cursor:wait; box-shadow:none; }
button.ghost { background:#fff; color:var(--navy); border:1px solid var(--border); font-weight:500; }
button.danger { background:#fff; color:var(--red); border:1px solid rgba(225,29,72,0.3); font-weight:500; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-dim); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); }
td { padding:11px 10px; border-bottom:1px solid rgba(31,45,89,0.07); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
td select { padding:6px 8px; font:inherit; font-size:12.5px; border:1px solid var(--border); border-radius:8px; background:#fbfcfe; }
.you { font-size:10.5px; color:#fff; background:var(--blue); border-radius:10px; padding:2px 8px; margin-left:6px; }
.actions { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.actions button { padding:7px 12px; font-size:12px; }
#msg { display:none; margin-top:14px; padding:10px 14px; font-size:12.5px; border-radius:10px; word-break:break-all; }
#msg.err { color:var(--red); background:rgba(225,29,72,0.07); border:1px solid rgba(225,29,72,0.25); }
#msg.ok { color:var(--green); background:rgba(22,163,74,0.07); border:1px solid rgba(22,163,74,0.25); }
#msg.show { display:block; }
#msg a { color:var(--blue); }
.empty { text-align:center; color:var(--text-dim); padding:26px 0; font-size:13px; }
@media (max-width:640px){ .hide-sm{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Dashboard Users<span>Who can sign in to this dashboard</span></h1>
    <div><a href="/">&larr; Back to dashboard</a> &nbsp;·&nbsp; <a href="/logout">Sign out</a></div>
  </div>

  <div class="badges" id="badges"></div>

  <div class="card">
    <h2>Add a user</h2>
    <div class="addrow">
      <input id="newEmail" type="email" placeholder="teammate@hopcharge.com">
      <select id="newRole">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
      <button id="addBtn">Add &amp; send invite</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>Current users</h2>
    <table>
      <thead><tr><th>Email</th><th>Role</th><th class="hide-sm">Added</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  var me = null, state = null;
  var msg = document.getElementById('msg');

  function show(text, ok, html) {
    if (html) { msg.innerHTML = text; } else { msg.textContent = text; }
    msg.className = 'show ' + (ok ? 'ok' : 'err');
    msg.id = 'msg';
  }

  async function api(path, body) {
    var resp = await fetch(path, body ? {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    } : undefined);
    var data = {}; try { data = await resp.json(); } catch (_) {}
    if (!resp.ok) throw new Error(data.detail || ('Request failed (' + resp.status + ')'));
    return data;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function linkNote(prefix, data, key) {
    var link = data[key];
    if (data.email_sent) {
      return prefix + ' — an email with the link was sent to ' + esc(data.email) + '.';
    }
    return prefix + ' — email is not configured on this server, so copy this link and ' +
           'share it with them yourself:<br><a href="' + esc(link) + '">' + esc(link) + '</a>';
  }

  function render() {
    var rows = document.getElementById('rows');
    var badges = document.getElementById('badges');
    badges.innerHTML =
      '<span class="badge">Signed in as <b>' + esc(me) + '</b></span>' +
      '<span class="badge">Accounts stored in: <b>' + (state.sync === 'db'
        ? 'shared database (synced across installations)' : 'this installation only') + '</b></span>' +
      '<span class="badge">Invite / reset emails: <b>' + (state.smtp_configured
        ? 'enabled' : 'not set up (links shown for copying)') + '</b></span>';

    if (!state.users.length) {
      rows.innerHTML = '<tr><td colspan="4" class="empty">No users yet.</td></tr>';
      return;
    }
    rows.innerHTML = state.users.map(function (u) {
      var isMe = u.email === me;
      return '<tr>' +
        '<td>' + esc(u.email) + (isMe ? '<span class="you">you</span>' : '') + '</td>' +
        '<td><select data-role="' + esc(u.email) + '"' + '>' +
          '<option value="user"' + (u.role !== 'admin' ? ' selected' : '') + '>User</option>' +
          '<option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>Admin</option>' +
        '</select></td>' +
        '<td class="hide-sm">' + esc((u.created || '').slice(0, 10)) + '</td>' +
        '<td><div class="actions">' +
          '<button class="ghost" data-reset="' + esc(u.email) + '">Send reset link</button>' +
          (isMe ? '' : '<button class="danger" data-del="' + esc(u.email) + '">Remove</button>') +
        '</div></td>' +
      '</tr>';
    }).join('');

    rows.querySelectorAll('[data-role]').forEach(function (sel) {
      sel.addEventListener('change', async function () {
        try {
          await api('/api/auth/users', { email: sel.dataset.role, role: sel.value });
          show('Role updated for ' + sel.dataset.role + '.', true);
          load();
        } catch (e) { show(e.message, false); load(); }
      });
    });
    rows.querySelectorAll('[data-reset]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        try {
          var d = await api('/api/auth/users/reset-link', { email: btn.dataset.reset });
          show(linkNote('Reset link created', d, 'reset_link'), true, true);
        } catch (e) { show(e.message, false); }
        btn.disabled = false;
      });
    });
    rows.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        if (!confirm('Remove ' + btn.dataset.del + '? They will no longer be able to sign in.')) return;
        try {
          await api('/api/auth/users/delete', { email: btn.dataset.del });
          show('Removed ' + btn.dataset.del + '.', true);
          load();
        } catch (e) { show(e.message, false); }
      });
    });
  }

  async function load() {
    try {
      var meResp = await api('/api/auth/me');
      if (meResp.auth === 'disabled') {
        document.querySelector('.wrap').innerHTML =
          '<div class="card"><h2>Sign-in is not enabled</h2><p style="font-size:13px;color:var(--text-mid)">' +
          'User accounts only apply when DASHBOARD_AUTH=on. <a href="/">Back to dashboard</a></p></div>';
        return;
      }
      me = meResp.email;
      state = await api('/api/auth/users');
      render();
    } catch (e) {
      document.querySelector('.wrap').innerHTML =
        '<div class="card"><h2>Admins only</h2><p style="font-size:13px;color:var(--text-mid)">' +
        esc(e.message) + ' &nbsp; <a href="/">Back to dashboard</a></p></div>';
    }
  }

  document.getElementById('addBtn').addEventListener('click', async function () {
    var btn = this, email = document.getElementById('newEmail').value.trim();
    if (!email) { show('Enter an email address first.', false); return; }
    btn.disabled = true; btn.textContent = 'Adding…';
    try {
      var d = await api('/api/auth/users', { email: email, role: document.getElementById('newRole').value });
      if (d.created) {
        show(linkNote('Added ' + esc(d.email), d, 'invite_link'), true, true);
      } else {
        show('That account already existed — its role was updated instead (password untouched).', true);
      }
      document.getElementById('newEmail').value = '';
      load();
    } catch (e) { show(e.message, false); }
    btn.disabled = false; btn.textContent = 'Add & send invite';
  });

  load();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hopcharge — Sign in</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --navy:#1F2D59; --blue:#2F5BEA; --pink:#E8537F;
  --bg:#f4f6fa; --text:#1f2a44; --text-mid:#5b6472; --text-dim:#8a93a6;
  --border:rgba(31,45,89,0.14); --red:#e11d48;
}
body {
  font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background-image:
    radial-gradient(900px 500px at 85% -10%, rgba(47,91,234,0.10), transparent 60%),
    radial-gradient(700px 420px at -10% 110%, rgba(31,45,89,0.10), transparent 60%);
}
.card {
  width:100%; max-width:400px; background:#fff; border:1px solid var(--border);
  border-radius:20px; overflow:hidden; box-shadow:0 18px 50px rgba(31,45,89,0.16);
}
.card-head {
  background:linear-gradient(135deg,#1F2D59 0%,#243769 60%,#2F5BEA 140%);
  padding:34px 32px 28px; text-align:center;
}
.card-head img { height:44px; max-width:80%; object-fit:contain; }
.card-head p { margin-top:10px; color:rgba(255,255,255,0.75); font-size:12.5px; letter-spacing:0.4px; }
.card-body { padding:30px 32px 34px; }
h1 { font-size:17px; font-weight:600; margin-bottom:8px; }
.sub { font-size:13px; color:var(--text-mid); line-height:1.6; margin-bottom:26px; }
.google-btn {
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  padding:12px; font:inherit; font-size:14px; font-weight:600; color:var(--text);
  background:#fff; border:1px solid var(--border); border-radius:10px;
  cursor:pointer; text-decoration:none; transition:box-shadow .15s, transform .1s, border-color .15s;
}
.google-btn:hover { box-shadow:0 8px 20px rgba(31,45,89,0.14); transform:translateY(-1px); border-color:#c7cee0; }
.error {
  display:none; margin-top:16px; padding:10px 12px; font-size:12.5px; color:var(--red);
  background:rgba(225,29,72,0.07); border:1px solid rgba(225,29,72,0.25); border-radius:10px;
}
.error.show { display:block; animation:shake .3s; }
@keyframes shake { 25%{transform:translateX(-4px)} 50%{transform:translateX(4px)} 75%{transform:translateX(-2px)} }
.foot { margin-top:22px; text-align:center; font-size:11.5px; color:var(--text-dim); line-height:1.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <img src="/static/hopcharge-white.png" alt="HopCharge">
      <p>HR BAU AUTOMATION DASHBOARD</p>
    </div>
    <div class="card-body">
      <h1>Sign in to continue</h1>
      <div class="sub">Use your Hopcharge Google account. Access is restricted to email addresses registered in the Employee Database.</div>
      <a id="google-btn" class="google-btn" href="#">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.27-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Sign in with Google
      </a>
      <div id="err" class="error"></div>
      <div class="foot">Access is restricted to authorised HopCharge staff.</div>
    </div>
  </div>

<script>
(function () {
  var next = new URLSearchParams(location.search).get('next') || '/';
  if (next.charAt(0) !== '/' || next.slice(0, 2) === '//') next = '/';
  document.getElementById('google-btn').href =
    '/api/auth/google/authorize?next=' + encodeURIComponent(next);

  var error = new URLSearchParams(location.search).get('error');
  if (error) {
    var err = document.getElementById('err');
    err.textContent = error;
    err.classList.add('show');
  }
})();
</script>
</body>
</html>

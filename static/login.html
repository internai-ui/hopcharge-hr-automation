<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hopcharge — Sign in</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --navy:#1F2D59; --blue:#2F5BEA; --pink:#E8537F;
  --bg:#f4f6fa; --text:#1f2a44; --text-mid:#5b6472; --text-dim:#8a93a6;
  --border:rgba(31,45,89,0.14); --red:#e11d48;
}
body {
  font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background-image:
    radial-gradient(900px 500px at 85% -10%, rgba(47,91,234,0.10), transparent 60%),
    radial-gradient(700px 420px at -10% 110%, rgba(31,45,89,0.10), transparent 60%);
}
.card {
  width:100%; max-width:400px; background:#fff; border:1px solid var(--border);
  border-radius:20px; overflow:hidden; box-shadow:0 18px 50px rgba(31,45,89,0.16);
}
.card-head {
  background:linear-gradient(135deg,#1F2D59 0%,#243769 60%,#2F5BEA 140%);
  padding:34px 32px 28px; text-align:center;
}
.card-head img { height:44px; max-width:80%; object-fit:contain; }
.card-head p { margin-top:10px; color:rgba(255,255,255,0.75); font-size:12.5px; letter-spacing:0.4px; }
.card-body { padding:30px 32px 34px; }
h1 { font-size:17px; font-weight:600; margin-bottom:18px; }
label { display:block; font-size:12px; font-weight:500; color:var(--text-mid); margin:14px 0 6px; }
input {
  width:100%; padding:11px 14px; font:inherit; font-size:14px; color:var(--text);
  border:1px solid var(--border); border-radius:10px; background:#fbfcfe; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,91,234,0.14); }
button {
  width:100%; margin-top:22px; padding:12px; font:inherit; font-size:14px; font-weight:600;
  color:#fff; background:linear-gradient(120deg,var(--navy),#2a3d78); border:0; border-radius:10px;
  cursor:pointer; transition:transform .1s, box-shadow .15s, opacity .15s;
}
button:hover { box-shadow:0 8px 20px rgba(31,45,89,0.28); transform:translateY(-1px); }
button:disabled { opacity:.6; cursor:wait; transform:none; box-shadow:none; }
.error {
  display:none; margin-top:14px; padding:10px 12px; font-size:12.5px; color:var(--red);
  background:rgba(225,29,72,0.07); border:1px solid rgba(225,29,72,0.25); border-radius:10px;
}
.error.show { display:block; animation:shake .3s; }
@keyframes shake { 25%{transform:translateX(-4px)} 50%{transform:translateX(4px)} 75%{transform:translateX(-2px)} }
.foot { margin-top:18px; text-align:center; font-size:11.5px; color:var(--text-dim); }
.links { margin-top:16px; text-align:center; font-size:12px; }
.links a { color:var(--blue); text-decoration:none; font-weight:500; }
.links a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <img src="/static/hopcharge-white.png" alt="HopCharge">
      <p>HR BAU AUTOMATION DASHBOARD</p>
    </div>
    <div class="card-body">
      <h1>Sign in to continue</h1>
      <form id="f" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@hopcharge.com" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button id="btn" type="submit">Sign in</button>
        <div id="err" class="error"></div>
      </form>
      <div class="links"><a href="/reset">Forgot password?</a></div>
      <div class="foot">Access is restricted to authorised HopCharge staff.</div>
    </div>
  </div>

<script>
(function () {
  // Where to go after login. Only same-site paths are allowed (no open redirect).
  var next = new URLSearchParams(location.search).get('next') || '/';
  if (next.charAt(0) !== '/' || next.slice(0, 2) === '//') next = '/';

  var form = document.getElementById('f'),
      btn  = document.getElementById('btn'),
      err  = document.getElementById('err');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      var resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        })
      });
      if (resp.ok) { location.replace(next); return; }
      var msg = 'Incorrect email or password.';
      try { msg = (await resp.json()).detail || msg; } catch (_) {}
      err.textContent = msg; err.classList.add('show');
    } catch (_) {
      err.textContent = 'Could not reach the server. Please try again.';
      err.classList.add('show');
    }
    btn.disabled = false; btn.textContent = 'Sign in';
  });
})();
</script>
</body>
</html>
